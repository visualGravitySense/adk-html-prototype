<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); max-height: 0; } to { opacity: 1; transform: translateY(0); max-height: 80px; } }
  </style>
</helmet>
<div style="width:1100px;max-width:100%;margin:0 auto;padding:48px 32px;background:oklch(0.99 0.003 90);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:oklch(0.22 0.01 90);box-sizing:border-box">

  <h2 style="text-align:center;font-size:28px;line-height:1.3;font-weight:800;margin:0 0 20px;letter-spacing:0.2px">PAKKUMINE ON AKTUAALNE DIISEL AUTOOMANIKELE, KELLE SÕIDUKITEL ESINEB JÄRGMISEID PROBLEEME:</h2>
  <div style="height:1px;background:oklch(0.85 0.01 90);margin:0 0 8px"></div>

  <p style="text-align:center;font-size:14px;color:oklch(0.45 0.01 90);margin:14px 0 32px">Vali oma auto probleemid — saad kohe teada, kas vajad kontrolli.</p>

  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0 32px">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="11">
      <button
        onClick="{{ it.onToggle }}"
        style="{{ it.itemStyle }}"
        style-hover="{{ it.itemHoverStyle }}"
      >
        <span style="{{ it.checkStyle }}">{{ it.checkMark }}</span>
        <span style="text-align:left">{{ it.text }}</span>
      </button>
    </sc-for>
  </div>

  <sc-if value="{{ selectedCount }}" hint-placeholder-val="{{ 0 }}">
    <div style="{{ bannerStyle }}">
      <span style="font-size:22px;font-weight:800">{{ selectedCount }}</span>
      <span>{{ bannerText }}</span>
    </div>
  </sc-if>

  <div style="display:flex;flex-direction:column;gap:14px;align-items:center;margin-top:32px">
    <a href="mailto:info@ecoteenindus.ee" style="{{ ctaStyle }}" style-hover="{{ ctaHoverStyle }}">
      Pange aeg kinni &#9993; e-posti teel
    </a>
    <a href="tel:+37256702700" style="{{ ctaStyle }}" style-hover="{{ ctaHoverStyle }}">
      Pange aeg kinni &#128222; + 372 567 02 700
    </a>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:620}}">
const SYMPTOMS = [
  'mootori käivitus on raskendatud;',
  'mootori võimsus on langenud;',
  'kütusekulu on kasvanud;',
  'väljalasketorust tuleb musta suitsu;',
  'väljalasketorust tuleb halli või valget suitsu;',
  'mootori töö on raskendatud;',
  'mootori täisvõimsus ei arene;',
  'mootori müra on kõrgendatud;',
  'tühikäigul töötab mootor tõrgetega;',
  'mootori äkiline seiskumine.',
  'tühikäigul esineb väntvõlli pöörete sageduse kõikumist;'
];

class Component extends DCLogic {
  state = { selected: new Array(SYMPTOMS.length).fill(false) };

  toggle(i) {
    this.setState(s => {
      const next = s.selected.slice();
      next[i] = !next[i];
      return { selected: next };
    });
  }

  getItemStyle(i) {
    const active = this.state.selected[i];
    return {
      display: 'flex',
      gap: '10px',
      alignItems: 'flex-start',
      textAlign: 'left',
      fontSize: '14px',
      lineHeight: '1.5',
      padding: '9px 10px',
      margin: '0',
      border: 'none',
      borderRadius: '6px',
      cursor: 'pointer',
      background: active ? 'oklch(0.94 0.05 25)' : 'transparent',
      color: active ? 'oklch(0.35 0.01 90)' : 'oklch(0.35 0.01 90)',
      fontFamily: 'inherit',
      width: '100%',
      boxSizing: 'border-box',
      transition: 'background 0.15s ease'
    };
  }

  getItemHoverStyle(i) {
    const active = this.state.selected[i];
    if (active) return {};
    return { background: 'oklch(0.96 0.005 90)' };
  }

  getCheckStyle(i) {
    const active = this.state.selected[i];
    return {
      flex: 'none',
      width: '18px',
      height: '18px',
      borderRadius: '4px',
      border: active ? 'none' : '2px solid oklch(0.7 0.01 90)',
      background: active ? 'oklch(0.52 0.19 25)' : 'transparent',
      color: 'white',
      fontSize: '12px',
      fontWeight: 700,
      display: 'flex',
      alignItems: 'center',
      justifyContent: 'center',
      marginTop: '2px',
      transition: 'all 0.15s ease'
    };
  }

  getCheckMark(i) {
    return this.state.selected[i] ? '✓' : '';
  }

  get selectedCount() {
    return this.state.selected.filter(Boolean).length;
  }

  get bannerText() {
    const n = this.selectedCount;
    if (n === 0) return '';
    if (n === 1) return 'probleem tuvastatud — soovitame lasta pihustid üle kontrollida.';
    if (n <= 3) return 'probleemi tuvastatud — soovitame lasta pihustid üle kontrollida.';
    return 'probleemi tuvastatud — teie pihustid vajavad tõenäoliselt kiiret kontrolli!';
  }

  get bannerStyle() {
    const n = this.selectedCount;
    const urgent = n > 3;
    return {
      display: 'flex',
      gap: '8px',
      alignItems: 'center',
      justifyContent: 'center',
      marginTop: '28px',
      padding: '16px 20px',
      borderRadius: '8px',
      fontSize: '15px',
      fontWeight: 600,
      background: urgent ? 'oklch(0.52 0.19 25)' : 'oklch(0.94 0.05 25)',
      color: urgent ? 'white' : 'oklch(0.4 0.15 25)',
      animation: 'popIn 0.25s ease'
    };
  }

  get ctaStyle() {
    return {
      display: 'flex',
      alignItems: 'center',
      gap: '10px',
      justifyContent: 'center',
      width: '420px',
      maxWidth: '100%',
      padding: '16px 24px',
      borderRadius: '999px',
      background: 'oklch(0.52 0.19 25)',
      color: 'white',
      fontSize: '17px',
      fontWeight: 600,
      textDecoration: 'none',
      boxSizing: 'border-box',
      transition: 'background 0.15s ease'
    };
  }

  get ctaHoverStyle() {
    return { background: 'oklch(0.46 0.19 25)' };
  }

  renderVals() {
    const items = SYMPTOMS.map((text, i) => ({
      text,
      onToggle: () => this.toggle(i),
      itemStyle: this.getItemStyle(i),
      itemHoverStyle: this.getItemHoverStyle(i),
      checkStyle: this.getCheckStyle(i),
      checkMark: this.getCheckMark(i)
    }));
    return {
      items,
      selectedCount: this.selectedCount,
      bannerText: this.bannerText,
      bannerStyle: this.bannerStyle,
      ctaStyle: this.ctaStyle,
      ctaHoverStyle: this.ctaHoverStyle
    };
  }
}

</script>
</body>
</html>
